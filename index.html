const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,save){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(SALT),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(IV)},key,u(CT)));
  if(save){try{localStorage.setItem('pgf_pw',pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
async function tryOpen(){const v=document.getElementById('pw').value;document.getElementById('err').textContent='';
  try{await open_(v,true)}catch(e){document.getElementById('err').textContent='Неверный пароль'}}
document.getElementById('go').onclick=tryOpen;
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')tryOpen()};
(async()=>{let s=null;try{s=localStorage.getItem('pgf_pw')}catch(e){}
  if(s){try{await open_(s,false);return}catch(e){try{localStorage.removeItem('pgf_pw')}catch(_){}}}
  document.getElementById('lock').hidden=false;})();
</script></body></html>
