const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const norm=s=>String(s).toUpperCase().replace(/[^0-9A-Z]/g,'');
async function open_(pw,save){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(SALT),iterations:250000,hash:'SHA-256'},base,256);
  const slot=SLOTS[hex(await crypto.subtle.digest('SHA-256',bits)).slice(0,16)];
  if(!slot) throw new Error('bad');
  const s=u(slot),wk=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:s.slice(0,12)},wk,s.slice(12));
  const kc=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(IV)},kc,u(CT)));
  if(save){try{localStorage.setItem('pgf_pw',pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
async function tryOpen(){const v=document.getElementById('pw').value;const e=document.getElementById('err');e.textContent='Проверяю…';
  try{await open_(v,true)}catch(x){e.textContent='Неверный или отключённый код'}}
document.getElementById('go').onclick=tryOpen;
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')tryOpen()};
(async()=>{let s=null;try{s=localStorage.getItem('pgf_pw')}catch(e){}
  if(s){try{await open_(s,false);return}catch(e){try{localStorage.removeItem('pgf_pw')}catch(_){}}}
  document.getElementById('lock').hidden=false;})();
})();
</script></body></html>
